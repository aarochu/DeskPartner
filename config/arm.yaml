mode: single_arm
sdk:
  repo: ~/reBotArm_control_py
  hardware_yaml: rebotarm_dm.yaml
  arm_control_mode: mit
follower:
  type: seeed_b601_dm_follower
  port: /dev/ttyACM0
  id: follower1
  can_adapter: damiao
leader:
  type: rebot_arm_102_leader
  port: /dev/ttyUSB0
  id: rebot_arm_102_leader
joint_directions:
  shoulder_pan: -1
  shoulder_lift: -1
  elbow_flex: 1
  wrist_flex: 1
  wrist_yaw: 1
  wrist_roll: -1
  gripper: -4
home:
  # Teach: DESKPARTNER_DRY_RUN=0 python -m p1_arm_motion.teach_home --live
  joints_deg: null
  xyz_m: null
  rpy_rad: [0.0, 0.0, 0.0]
  description: Fully clear of overhead camera FOV
safety:
  speed_multiplier: 0.5
  base_duration_s: 2.5
  slow_descend_duration_s: 3.5
  max_speed: 0.15
  transit_height_mm: 120
  approach_height_mm: 40
  reach_tolerance_mm: 15
  click_verify_tolerance_mm: 5
gripper:
  close_position_rad: 0.0
  open_via_sdk: true
  foam_tape: true
grasp_heights_mm:
  paper: 15
  crumpled_paper: 15
  pen: 18
  marker: 20
  block: 25
  foam_block: 25
  light_cup: 30
  default: 20
