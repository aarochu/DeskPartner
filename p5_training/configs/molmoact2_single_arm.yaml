# MolmoAct 2 — single-arm LoRA fine-tune (hackathon scope)
# Confirm checkpoint + entrypoint with organizers (newt vs Ai2 scripts).

exp_name: deskpartner_rebot_b601_lora
policy: molmoact2
embodiment: single_arm
base_checkpoint: allenai/MolmoAct2   # FILL if organizers give better start (NOT SO-101 newt zero-shot)

# Modal
gpu: A100-40GB                       # override via CLI / modal_finetune.GPU
wall_clock_timeout_s: 21600          # 6h hard stop
save_interval_steps: 500
max_steps: 5000

dataset_repo_id: deskpartner/crumpled_paper_molmoact2
# camera_keys filled by build_dataset_mixture from dataset meta
camera_keys: [front, side]
locked_cameras: true

finetune:
  mode: lora                         # lora | action_expert_only
  enable_lora_vlm: true
  train_action_expert_only: false
  enable_lora_action_expert: false   # keep action expert fully trainable (Ai2 rec)
  full_finetune: false               # NEVER true this weekend

# Set at venue once confirmed:
# train_entrypoint: ai2_train_lerobot | newt | lerobot_train
# train_cmd: ["torchrun", "launch_scripts/train_lerobot.py", ...]

inference:
  serve_on: modal
  action_chunks: true

notes: |
  No zero-shot DROID/SO-100 help for reBot. Demos carry embodiment learning.
  If Sat night eval bad: one data fix retry, then cut B.
